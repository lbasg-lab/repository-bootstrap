[project]
name = "repository-bootstrap"
version = "0.1.0"
description = "Declarative GitHub repository bootstrap framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Lorea Bas" }
]

dependencies = [
    "requests>=2.32.0"
]

[project.scripts]
repository-bootstrap = "repository_bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"