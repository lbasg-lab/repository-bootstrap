name: Authenticate

description: Authenticate as the Engineering Lab GitHub App and generate an installation token.

inputs:
  app-id:
    description: GitHub App ID.
    required: true

  private-key:
    description: GitHub App private key.
    required: true

  owner:
    description: GitHub owner where the GitHub App is installed.
    required: true

  repositories:
    description: Comma-separated list of repositories to scope the installation token.
    required: false
    default: ""

outputs:
  token:
    description: GitHub App installation token.
    value: ${{ steps.create-token.outputs.token }}

runs:
  using: composite

  steps:
    - name: Generate installation token
      id: create-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}