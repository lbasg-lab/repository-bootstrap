name: Repository Bootstrap

on:
  workflow_dispatch:
    inputs:
      owner:
        description: Repository owner.
        required: true
        type: string

      repository:
        description: Repository name.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repository-bootstrap-${{ inputs.owner }}-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Authenticate as GitHub App
        id: authenticate
        uses: ./.github/actions/authenticate
        with:
          app-id: ${{ secrets.BOOTSTRAP_APP_ID }}
          private-key: ${{ secrets.BOOTSTRAP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repository }}

      - name: Validate target repository
        env:
          GH_TOKEN: ${{ steps.authenticate.outputs.token }}
        run: |
          gh api \
            repos/${{ inputs.owner }}/${{ inputs.repository }} \
            --jq '.full_name'

      - name: Configure repository settings
        uses: ./.github/actions/configure-repository
        with:
          owner: ${{ inputs.owner }}
          repository: ${{ inputs.repository }}
          token: ${{ steps.authenticate.outputs.token }}

      - name: Configure repository rulesets
        uses: ./.github/actions/configure-rulesets
        with:
          owner: ${{ inputs.owner }}
          repository: ${{ inputs.repository }}
          token: ${{ steps.authenticate.outputs.token }}
